function sprite(c){const s=document.createElement('canvas');s.width=s.height=96;const g=s.getContext('2d'),r=g.createRadialGradient(48,48,0,48,48,48);r.addColorStop(0,'rgba('+c+',.55)');r.addColorStop(.5,'rgba('+c+',.2)');r.addColorStop(1,'rgba('+c+',0)');g.fillStyle=r;g.fillRect(0,0,96,96);return s}
spr.a=sprite('170,130,255');spr.b=sprite('150,170,190');spr.c=sprite('90,255,120');spr.r=sprite('255,40,60');
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0);
 eyes=Array.from({length:5},(_,i)=>({x:W*(i%2?rnd(.88,.96):rnd(.04,.12)),y:H*rnd(.1,.55),ph:rnd(0,9),c:i%2?'255,40,40':'80,255,80'}));
 bats=Array.from({length:6},()=>({x:rnd(0,W),y:rnd(20,H*.35),v:rnd(.7,1.8)*(Math.random()<.5?1:-1),s:rnd(.5,1),ph:rnd(0,6)}));
 ghosts=Array.from({length:3},(_,i)=>({o:rnd(0,W),y:H*(.14+i*.14),sp:rnd(.15,.35)*(i%2?-1:1),s:rnd(55,85),ph:rnd(0,6)}))}
addEventListener('resize',size);size();
function puff(){const k=nm?'r':['a','b','c','b'][Math.random()*4|0];smoke.push({x:rnd(-40,W+40),y:H*rnd(.62,1.05),vx:rnd(-.3,.3),vy:-rnd(.25,.8),r:rnd(40,90),g:rnd(.35,.7),l:1,k})}
function burst(px,py,n){const cs=['#ffb347','#ff7a00','#e8c15a','#ff1fa8','#fff3b0'];for(let i=0;i<n;i++){const a=Math.random()*6.283,v=2+Math.random()*7;sp.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,l:1,c:cs[i%5]})}}
function ghost(g,t){const px=((g.o+t*40*g.sp*3)%(W+260)+W+260)%(W+260)-130,py=g.y+Math.sin(t*.8+g.ph)*22,s=g.s;
 x.save();x.globalAlpha=.1+.08*Math.sin(t*1.3+g.ph);x.fillStyle='#e8fff0';x.shadowColor='#58ff90';x.shadowBlur=22;x.beginPath();x.moveTo(px-s*.5,py+s);x.lineTo(px-s*.5,py);x.arc(px,py,s*.5,Math.PI,0);x.lineTo(px+s*.5,py+s);
 for(let i=4;i>0;i--){x.quadraticCurveTo(px+s*(i*.25-.37),py+s*(1.2+Math.sin(t*3+i)*.1),px+s*(i*.25-.5)+0,py+s)}x.fill();
 x.globalAlpha=.55;x.fillStyle='#000';x.shadowBlur=0;x.beginPath();x.ellipse(px-s*.17,py,s*.07,s*.11,0,0,6.283);x.ellipse(px+s*.17,py,s*.07,s*.11,0,0,6.283);x.ellipse(px,py+s*.28,s*.08,s*.12,0,0,6.283);x.fill();x.restore()}
// audio
let AC,master,ch,an,nb,gs=0,next=0,ev=[],lk=-9,on=false,muted=false,fd,shp,nm=false,nextC=0,kc=0,laugh=0,gl=0;
function nz(t,d,type,f,g,dest){const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),ga=AC.createGain();s.buffer=nb;s.loop=true;fl.type=type;fl.frequency.value=f;ga.gain.setValueAtTime(g,t);ga.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl);fl.connect(ga);ga.connect(dest||master);s.start(t);s.stop(t+d)}
function osc(t,d,type,f,g,cut,f2,dist,dest){const o=AC.createOscillator(),fl=AC.createBiquadFilter(),ga=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d*.5);fl.type='lowpass';fl.frequency.value=cut||20000;ga.gain.setValueAtTime(g,t);ga.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(fl);if(dist){fl.connect(shp);shp.connect(ga)}else fl.connect(ga);ga.connect(dest||master);o.start(t);o.stop(t+d)}
function lfo(p,f,a){const l=AC.createOscillator(),g=AC.createGain();l.frequency.value=f;g.gain.value=a;l.connect(g);g.connect(p);return l}
function whisper(t){const s=AC.createBufferSource(),f1=AC.createBiquadFilter(),f2=AC.createBiquadFilter(),g=AC.createGain(),pn=AC.createStereoPanner();s.buffer=nb;s.loop=true;f1.type=f2.type='bandpass';f1.Q.value=f2.Q.value=6;f1.frequency.setValueAtTime(rnd(400,700),t);f1.frequency.linearRampToValueAtTime(rnd(500,900),t+1.4);f2.frequency.setValueAtTime(rnd(1500,2200),t);f2.frequency.linearRampToValueAtTime(rnd(1200,2600),t+1.4);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.6,t+.3);g.gain.setValueAtTime(.6,t+.9);g.gain.linearRampToValueAtTime(0,t+1.5);pn.pan.value=rnd(-1,1);s.connect(f1);s.connect(f2);f1.connect(g);f2.connect(g);g.connect(pn);pn.connect(ch);s.start(t);s.stop(t+1.6)}
function box(t){const n=[587.33,698.46,880,830.61,698.46,659.25,587.33,523.25],st=rnd(0,3)|0;for(let i=0;i<7;i++){const f=n[(i+st)%8]*(Math.random()<.2?.97:1);osc(t+i*.34,.9,'sine',f,.14,null,0,false,ch);osc(t+i*.34,.5,'triangle',f*2,.04,null,0,false,ch)}}
function creak(t){const o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain(),l=lfo(g.gain,rnd(6,11),.25);o.type='sawtooth';o.frequency.setValueAtTime(rnd(90,140),t);o.frequency.linearRampToValueAtTime(rnd(160,260),t+1.6);f.type='bandpass';f.Q.value=8;f.frequency.setValueAtTime(600,t);f.frequency.linearRampToValueAtTime(1400,t+1.6);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.3,t+.3);g.gain.linearRampToValueAtTime(0,t+1.7);o.connect(f);f.connect(g);g.connect(ch);o.start(t);l.start(t);o.stop(t+1.8);l.stop(t+1.8)}
function growl(t){const o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain(),l=lfo(g.gain,22,.4);o.type='sawtooth';o.frequency.setValueAtTime(70,t);o.frequency.exponentialRampToValueAtTime(38,t+1.3);f.type='lowpass';f.frequency.value=260;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.7,t+.2);g.gain.linearRampToValueAtTime(0,t+1.4);o.connect(f);f.connect(g);g.connect(ch);o.start(t);l.start(t);o.stop(t+1.5);l.stop(t+1.5)}
function laughS(t){for(let i=0;i<6;i++)osc(t+i*.13,.12,'square',460-i*25,.08,1600,300,false,ch);ev.push([t,'l'])}
function screech(t){const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),v=lfo(o.frequency,38,60);o.type='sawtooth';o2.type='square';[o,o2].forEach((q,i)=>{q.frequency.setValueAtTime(700+i*13,t);q.frequency.exponentialRampToValueAtTime(2600,t+.25);q.frequency.exponentialRampToValueAtTime(500,t+.7)});g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.06);g.gain.exponentialRampToValueAtTime(.001,t+.75);o.connect(g);o2.connect(g);g.connect(ch);o.start(t);o2.start(t);v.start(t);o.stop(t+.8);o2.stop(t+.8);v.stop(t+.8);nz(t,.5,'highpass',3500,.2,ch);ev.push([t,'s'])}
function creeps(){if(!on)return;const now=AC.currentTime;if(now<nextC||gs<24)return;const t=now+.05,r=Math.random();
 if(r<.2){whisper(t);ev.push([t,'w'])}else if(r<.38)box(t);else if(r<.52)creak(t);else if(r<.67)growl(t);else if(r<.83)laughS(t);else screech(t);
 nextC=now+(nm?rnd(1.2,3):rnd(3,7))}
const BASS=[36.71,36.71,38.89,34.65],ARP=[146.83,155.56,220,207.65,293.66,311.13,220,155.56];
function play(g,t){
  if(g<96){if(g%8===0){osc(t,.22,'sine',72,1,220,40);ev.push([t,'k'])}if(g%8===2)osc(t,.2,'sine',60,.7,200,36);
    if(g===64){const d=32*60/132/4,s=AC.createBufferSource(),f=AC.createBiquadFilter(),ga=AC.createGain();s.buffer=nb;s.loop=true;f.type='bandpass';f.Q.value=3;f.frequency.setValueAtTime(150,t);f.frequency.exponentialRampToValueAtTime(7000,t+d);ga.gain.setValueAtTime(.04,t);ga.gain.linearRampToValueAtTime(.5,t+d);ga.gain.linearRampToValueAtTime(0,t+d+.1);s.connect(f);f.connect(ga);ga.connect(master);s.start(t);s.stop(t+d+.2)}return}
  const s=(g-96)%64,bar=s>>4;
  if(s%4===0){osc(t,.42,'sine',190,1.1,null,38);nz(t,.02,'highpass',2000,.3);ev.push([t,'k'])}
  if(s%4===2){nz(t,.09,'highpass',8000,.2);osc(t,.24,'sawtooth',BASS[bar],.5,320+bar*160,0,true)}
  if(s%2===1)nz(t,.03,'highpass',9000,.07);
  if(s%8===4)nz(t,.2,'bandpass',1500,.55);
  if(s===0){nz(t,1.6,'highpass',4500,.3);osc(t,1.2,'sine',70,.9,null,30);ev.push([t,'d'])}
  if(bar>=1)osc(t,.13,'sawtooth',ARP[s%8]*(bar>=2?2:1),.03+bar*.012,500+(s/64)*3600);
}
function sched(){while(next<AC.currentTime+.12){play(gs++,next);next+=60/132/4}creeps()}
function start(){
  AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.8;
  shp=AC.createWaveShaper();const c=new Float32Array(256);for(let i=0;i<256;i++)c[i]=Math.tanh((i/128-1)*4);shp.curve=c;
  const cp=AC.createDynamicsCompressor();an=AC.createAnalyser();an.fftSize=64;master.connect(an);an.connect(cp);cp.connect(AC.destination);
  nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  ch=AC.createGain();ch.connect(master);const len=AC.sampleRate*2.6,ib=AC.createBuffer(2,len,AC.sampleRate);for(let k=0;k<2;k++){const q=ib.getChannelData(k);for(let i=0;i<len;i++)q[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
  const rev=AC.createConvolver();rev.buffer=ib;const rg=AC.createGain();rg.gain.value=.8;ch.connect(rev);rev.connect(rg);rg.connect(master);
  // drone disonante (segunda menor)
  const dg=AC.createGain(),df=AC.createBiquadFilter();dg.gain.value=.22;df.type='lowpass';df.frequency.value=170;
  [36.71,38.89,73.4].forEach(f=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(df);o.start()});
  df.connect(dg);dg.connect(ch);lfo(df.frequency,.12,90).start();lfo(dg.gain,.35,.08).start();
  const t=AC.currentTime;nextC=t+3;next=t+.4;on=true;setInterval(sched,25);
}
document.getElementById('gate').addEventListener('click',function(){if(on)return;start();this.classList.add('go');document.querySelectorAll('.bt button').forEach(b=>b.style.display='block')},{once:true});
document.getElementById('mute').addEventListener('click',e=>{muted=!muted;master.gain.setTargetAtTime(muted?0:.8,AC.currentTime,.05);e.target.textContent=muted?'🔇':'🔊'});
document.getElementById('nmb').addEventListener('click',e=>{nm=!nm;document.body.classList.toggle('nm',nm);e.target.classList.toggle('on',nm);if(on){nextC=0;scare(1);if(!muted)growl(AC.currentTime+.05)}});
addEventListener('pointerdown',e=>{if(!on||e.target.closest('button,.tk'))return;burst(e.clientX,e.clientY,22);if(!muted)osc(AC.currentTime,.25,'square',700,.05,2500,1500,false,ch)});
function scare(k){rv.style.opacity=.7*k;wr.style.filter='hue-rotate('+((Math.random()*80-40)|0)+'deg) saturate(2) contrast(1.35)';wr.style.setProperty('--zs',1+.06*k);gl=k;setTimeout(()=>{rv.style.opacity=0;wr.style.filter='';wr.style.setProperty('--zs',1);gl=0},130+k*110)}
const cs=document.documentElement.style;
function frame(ms){
  const t=ms/1000,now=on?AC.currentTime:0;
  while(ev.length&&ev[0][0]<=now){const e=ev.shift();if(e[1]==='k'){lk=now;kc++}else if(e[1]==='d'){burst(W/2,H*.42,60);scare(.6)}else if(e[1]==='s')scare(1);else if(e[1]==='l')laugh=1.2;else if(e[1]==='w')laugh=.6}
  const p=on?Math.exp(-(now-lk)*7):0,a=on?1:.3;
  cs.setProperty('--b',p.toFixed(3));
  const lx=Math.sin(t*5)*12*(.4+.6*Math.abs(Math.sin(t*.35)))*a;
  wr.style.setProperty('--hy',(-p*7+Math.sin(t*1.1)*2).toFixed(1)+'px');
  wr.style.setProperty('--hr',((kc%2?1:-1)*p*1.3+Math.sin(t*.8)*.7).toFixed(2)+'deg');
  wr.style.setProperty('--lx',lx.toFixed(1)+'px');wr.style.setProperty('--ly',(p*6).toFixed(1)+'px');wr.style.setProperty('--lr',(lx*.1).toFixed(2)+'deg');
  wr.style.setProperty('--ry',(Math.abs(Math.sin(t*8))*5*a).toFixed(1)+'px');
  wr.style.setProperty('--jw',(laugh>0?Math.abs(Math.sin(t*26))*laugh*9:p*2).toFixed(1)+'px');
  wr.style.setProperty('--va',(t*160%360).toFixed(1)+'deg');
  wr.style.setProperty('--jx',gl?rnd(-7,7).toFixed(1)+'px':'0px');wr.style.setProperty('--jy',gl?rnd(-5,5).toFixed(1)+'px':'0px');
  laugh=Math.max(0,laugh-.025);
  x.clearRect(0,0,W,H);
  if(smoke.length<(nm?90:55)&&Math.random()<(nm?.7:.4))puff();
  x.save();x.globalCompositeOperation='screen';
  for(let i=smoke.length-1;i>=0;i--){const s=smoke[i];s.x+=s.vx+Math.sin(t+i)*.2;s.y+=s.vy;s.r+=.35;s.l-=.0035;if(s.l<=0||s.y<-100){smoke.splice(i,1);continue}x.globalAlpha=Math.min(1,s.l*1.4)*s.g;const r=s.r;x.drawImage(spr[nm&&s.k!=='r'?'r':s.k],s.x-r,s.y-r,r*2,r*2)}
  x.restore();
  ghosts.forEach(g=>ghost(g,t));
  // ojos en la oscuridad
  x.save();eyes.forEach(e=>{const o=Math.pow(Math.max(0,Math.sin(t*.45+e.ph)),6);if(o<.05)return;x.globalAlpha=o;const g=x.createRadialGradient(0,0,0,0,0,16);g.addColorStop(0,'rgba('+(nm?'255,40,40':e.c)+',1)');g.addColorStop(1,'rgba('+e.c+',0)');x.fillStyle=g;[-13,13].forEach(dx=>{x.save();x.translate(e.x+dx+Math.sin(t+e.ph)*3,e.y);x.scale(1,.55);x.beginPath();x.arc(0,0,16,0,6.283);x.fill();x.restore()})});x.restore();
  // murciélagos
  x.save();x.fillStyle='#000';x.shadowColor='#8a2bff';x.shadowBlur=8;
  bats.forEach(b=>{b.x+=b.v;if(b.x>W+60)b.x=-60;if(b.x<-60)b.x=W+60;const fl=Math.sin(t*12+b.ph);x.save();x.translate(b.x,b.y+Math.sin(t*2+b.ph)*10);x.scale(b.s*(b.v>0?1:-1),b.s);
    for(let m=0;m<2;m++){x.save();if(m)x.scale(-1,1);x.beginPath();x.moveTo(0,-2);x.quadraticCurveTo(14,-12-fl*9,30,-1);x.quadraticCurveTo(20,0,16,6);x.quadraticCurveTo(9,2,0,5);x.fill();x.restore()}
    x.beginPath();x.ellipse(0,1,4,7,0,0,6.283);x.fill();x.restore()});
  x.restore();
  // gotas de sangre (modo pesadilla)
  if(nm){if(drips.length<7&&Math.random()<.04)drips.push({x:rnd(0,W),y:0,v:rnd(1,2.6),len:rnd(30,90)});
    x.save();x.strokeStyle='#c4001e';x.fillStyle='#c4001e';x.shadowColor='#ff0030';x.shadowBlur=8;x.lineWidth=3;x.lineCap='round';
    for(let i=drips.length-1;i>=0;i--){const d=drips[i];d.y+=d.v;if(d.y-d.len>H){drips.splice(i,1);continue}x.beginPath();x.moveTo(d.x,Math.max(0,d.y-d.len));x.lineTo(d.x,d.y);x.stroke();x.beginPath();x.arc(d.x,d.y,4,0,6.283);x.fill()}x.restore()}
  // brasas
  x.save();x.globalCompositeOperation='lighter';
  for(let i=sp.length-1;i>=0;i--){const s=sp[i];s.x+=s.vx;s.y+=s.vy;s.vy+=.2;s.l-=.016;if(s.l<=0){sp.splice(i,1);continue}x.globalAlpha=s.l;x.fillStyle=s.c;x.fillRect(s.x,s.y,3,3)}
  x.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
